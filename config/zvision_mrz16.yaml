# ZVISION LiDAR Configuration for FAST-LIO (ROS1)


common:
    lid_topic: "/zvlidar_sdk/zvlidar_points_xyzirt"
    imu_topic: "/zvlidar_sdk/zvlidar_imu_msg"
    time_sync_en: true
    time_offset_lidar_to_imu: 0.0


max_iteration: 5
point_filter_num: 1
filter_size_corner: 0.3
filter_size_surf: 0.3
filter_size_map: 0.3

runtime_pos_log_enable: false

feature_extract_enable: false



cube_side_length: 1000.0
map_file_path: "./map.pcd"

preprocess:
    lidar_type: 5          # ZVISION = 5
    scan_line: 16         # 16 lines depending on model
    scan_rate: 5
    timestamp_unit: 2      # US (microseconds)
    blind: 2.0             # Minimum distance filter

mapping:
    acc_cov: 0.3          # IMU noise parameters
    gyr_cov: 0.1
    b_acc_cov: 0.0001
    b_gyr_cov: 0.0001
    fov_degree: 360.0
    det_range: 70.0
    extrinsic_est_en: false

    # ZVISION_MRZ16 extrinsic parameters 
    extrinsic_T: [ 0.00358, 0.02257, 0.03686 ]
    extrinsic_R: [ 1.,  0.,  0.,
                   0.,  1., 0.,
                   0., 0.,  1.]


publish:
    path_en: true
    scan_publish_en: true
    dense_publish_en: false
    scan_bodyframe_pub_en: true


pcd_save:
    pcd_save_en: true
    interval: -1                # -1: all frames in one pcd; >0: split every N frames
    leaf_size: 0.1             # voxel filter leaf size (0.0 = no filtering)


